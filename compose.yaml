services:
  db:
    image: postgres:16
    container_name: radar-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: radar_db
      POSTGRES_USER: radar_user
      POSTGRES_PASSWORD: changeme_local_dev
    volumes:
      - radar-db-data:/var/lib/postgresql/data

  frontend:
    image: frontend
    build:
      context: frontend
      dockerfile: ./Dockerfile
    environment:
      NODE_ENV: development
    ports:
      - 3000:4200

volumes:
  radar-db-data:
