spring:
  application:
    name: radar-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:radar_db}?sslmode=${DB_SSLMODE:prefer}}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:radar_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:changeme_local_dev}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # update es comodo en desarrollo; usar migraciones (Flyway/Liquibase) en produccion
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: ${PORT:8080}

# Clave HMAC para firmar los JWT (minimo 32 caracteres). Sobrescribir con variable de entorno en produccion.
jwt:
  secret: ${JWT_SECRET:cambia-esta-clave-secreta-por-una-real-de-al-menos-32-caracteres}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

google:
  client-id: ${GOOGLE_CLIENT_ID:485878779082-c5ogc8gk2aisvbs7q5guf9immef5pi7v.apps.googleusercontent.com}

recaptcha:
  enabled: ${RECAPTCHA_ENABLED:false}
  secret-key: ${RECAPTCHA_SECRET_KEY:}

app:
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:4200}
  admin:
    default-email: ${ADMIN_DEFAULT_EMAIL:admin@radar.com}
    default-password: ${ADMIN_DEFAULT_PASSWORD:Admin123!}
