databases:
  - name: radar-db
    plan: free
    databaseName: radar_db
    user: radar_user

services:
  - type: web
    name: radar-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radar-db
          property: connectionString
      - key: DB_HOST
        fromDatabase:
          name: radar-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: radar-db
          property: port
      - key: DB_USERNAME
        fromDatabase:
          name: radar-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: radar-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: radar-db
          property: database
      - key: DB_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN
        value: https://frontend-two-beta-35.vercel.app,http://localhost:4200
