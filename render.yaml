databases:
  - name: radar-db
    plan: free
    databaseName: radar_db
    user: radar_user

services:
  - type: web
    name: radar-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGIN
        value: https://frontend-two-beta-35.vercel.app
