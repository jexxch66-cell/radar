<router-outlet />
<app-cookie-consent />
<app-session-lock />
@if (canInstall()) {
	<button
		type="button"
		class="fixed bottom-4 left-4 z-[190] rounded-full bg-[#e8702a] px-5 py-3 text-sm font-semibold text-white shadow-lg transition-colors hover:bg-[#d2611f]"
		aria-label="Instalar RADAR como aplicación de escritorio"
		(click)="installApp()"
	>
		Instalar RADAR
	</button>
}

@if (showInstallHelp()) {
	<div class="fixed inset-0 z-[220] flex items-center justify-center bg-black/60 px-5 backdrop-blur-sm" role="presentation" (click)="closeInstallHelp()">
		<section class="w-full max-w-sm rounded-2xl border border-fg/20 bg-panel p-6 text-fg shadow-2xl" role="dialog" aria-modal="true" aria-labelledby="install-radar-title" (click)="$event.stopPropagation()">
			<h2 id="install-radar-title" class="font-playfair text-2xl italic">Instalar RADAR</h2>
			<p class="mt-3 text-sm leading-6 text-fg/70">
				En Chrome o Edge, abre el menú del navegador y selecciona <strong>Instalar RADAR</strong> o <strong>Instalar esta página como aplicación</strong>.
			</p>
			<button type="button" class="mt-5 rounded-full bg-[#e8702a] px-5 py-2.5 text-sm font-semibold text-white hover:bg-[#d2611f]" (click)="closeInstallHelp()">
				Entendido
			</button>
		</section>
	</div>
}
