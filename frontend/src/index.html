<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>RADAR</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8702a">
  <meta name="description" content="RADAR: reporta y consulta incidencias urbanas en tu ciudad.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="manifest" href="manifest.webmanifest">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    // Aplica el tema guardado antes de pintar para evitar el parpadeo claro->oscuro
    try {
      var t = localStorage.getItem('radar_theme');
      if (t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
