# Base de datos local para desarrollo. Los valores coinciden con los defaults de backend/src/main/resources/application.yml
services:
  db:
    image: postgres:16
    container_name: radar-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: radar_db
      POSTGRES_USER: radar_user
      POSTGRES_PASSWORD: changeme_local_dev
    volumes:
      - radar-db-data:/var/lib/postgresql/data

volumes:
  radar-db-data:
